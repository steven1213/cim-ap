<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="CIM IAM 控制台 · 统一身份认证与跨业务准入" />
    <title>CIM · IAM 控制台</title>
    <script>
      // 首屏渲染前应用主题，避免深浅色闪烁（FOUC）
      try {
        var t = localStorage.getItem('iam-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
