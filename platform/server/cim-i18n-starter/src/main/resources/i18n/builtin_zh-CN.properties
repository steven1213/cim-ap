# cim-i18n-starter 内置兜底文案（L3，简体中文）。
# 键与 sys_i18n.code 同构；启动时由 I18nSeedLoader 幂等写入 DB（scope=SYSTEM）。
# 命名规范：{namespace}.{module}.{item}

# ---- 通用 ----
common.action.confirm=确定
common.action.cancel=取消
common.action.save=保存
common.action.delete=删除
common.action.edit=编辑
common.action.create=新建
common.action.search=查询
common.action.reset=重置
common.action.refresh=刷新
common.action.close=关闭
common.action.export=导出
common.action.import=导入
common.action.more=更多
common.action.back=返回
common.action.submit=提交
common.action.enable=启用
common.action.disable=停用
common.status.enabled=启用
common.status.disabled=停用
common.status.yes=是
common.status.no=否
common.status.success=成功
common.status.failed=失败
common.loading=加载中…
common.noData=暂无数据
common.required=必填

# ---- 系统错误（与后端错误码对应） ----
sys.error.internal=服务器内部错误
sys.error.param=参数不合法
sys.error.unauthorized=未认证或登录已过期
sys.error.forbidden=没有访问权限
sys.error.notFound=资源不存在
sys.error.conflict=数据冲突
sys.error.validation=校验失败

# ---- 校验 ----
validation.notBlank={0} 不能为空
validation.size={0} 长度需在 {1} 到 {2} 之间
validation.email=邮箱格式不正确
validation.pattern={0} 格式不正确
validation.range={0} 需在 {1} 到 {2} 之间

# ---- 业务错误码（BizCode 枚举 i18nKey；GlobalExceptionHandler 按 code+args 解析） ----
biz.success=成功
biz.auth.unauthenticated=未认证或令牌已失效
biz.auth.badCredentials=用户名或密码错误
biz.auth.tokenExpired=令牌已过期
biz.auth.tokenRevoked=令牌已失效，请重新登录
biz.auth.accountLocked=账户已锁定，请稍后再试或联系管理员
biz.auth.noAdmission=无该应用的准入权限
biz.auth.accessDenied=无操作权限
biz.param.invalid=参数校验失败
biz.data.notFound=数据不存在
biz.data.conflict=数据冲突
biz.data.duplicate=数据已存在
biz.operation.notAllowed=当前状态不允许该操作
biz.data.concurrentModified=数据已被他人修改，请刷新后重试
biz.idempotent.replay=重复请求
biz.rateLimited=请求过于频繁，请稍后重试
biz.integration.failed=外部系统调用失败
biz.integration.timeout=外部系统调用超时
biz.system.error=系统繁忙，请稍后重试
