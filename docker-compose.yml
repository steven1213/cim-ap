# cim-ap 本地开发依赖编排
# 说明：仅用于本地一键拉起中间件，生产编排见 deploy/。
# 启动：docker compose up -d
# 停止：docker compose down  （加 -v 可清空数据卷）

services:
  # ===== 必选：关系型数据库（按需求选定一种方言，默认 MySQL）=====
  mysql:
    image: mysql:8.0
    container_name: cim-ap-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: cim_ap
      MYSQL_USER: cim
      MYSQL_PASSWORD: cim123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpwd"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cim-ap

  # ===== 必选：缓存 / 分布式锁 / 限流 / i18n 热更新 =====
  redis:
    image: redis:7-alpine
    container_name: cim-ap-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "redispwd"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispwd", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cim-ap

  # ===== 可选：消息队列（事务发件箱中继 / 领域事件，启用时取消注释）=====
  # kafka:
  #   image: bitnami/kafka:3.7
  #   container_name: cim-ap-kafka
  #   environment:
  #     KAFKA_CFG_NODE_ID: 1
  #     KAFKA_CFG_PROCESS_ROLES: controller,broker
  #     KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
  #     KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  #     KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
  #     KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:CONTROLLER,PLAINTEXT:PLAINTEXT
  #     KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
  #     KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
  #   ports:
  #     - "9092:9092"
  #   networks:
  #     - cim-ap

  # ===== 可选：反向代理（前端静态托管 + /api 反代后端，启用时取消注释）=====
  # nginx:
  #   image: nginx:1.27-alpine
  #   container_name: cim-ap-nginx
  #   depends_on:
  #     - mysql
  #     - redis
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  #   networks:
  #     - cim-ap

volumes:
  mysql-data:
  redis-data:

networks:
  cim-ap:
    driver: bridge
